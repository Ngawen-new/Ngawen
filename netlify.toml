# ============================================================
#  Netlify Configuration — Sistem Informasi Desa Ngawen
#  Static site + Serverless Functions (API)
# ============================================================

[build]
  # Publish directory contains the static website files
  publish = "web ngawen"
  # Serverless functions directory
  functions = "netlify/functions"
  # No build step needed (pure static + pre-built JS)
  command = "echo 'Desa Ngawen — Static site ready!'"

[build.environment]
  NODE_VERSION = "18"
  GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/1U-7voZdOpiAwoZdXZ98Orts92vCT1A7OlIDs0wk7r8hMQjlDzPMwOqro/exec"

[functions]
  # Use esbuild to bundle Node.js functions + dependencies
  node_bundler = "esbuild"
  included_files = ["web ngawen/data/content.json"]

# ============================================================
#  API REDIRECT: /api/* → Netlify Serverless Function
# ============================================================
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

# ============================================================
#  SECURITY HEADERS (Applied to all pages)
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options            = "SAMEORIGIN"
    X-XSS-Protection           = "1; mode=block"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://script.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self' https://www.google.com https://maps.google.com;"


# Cache static assets aggressively
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
